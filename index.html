<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>giasuchillchill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F3F4F9; --surface:#FFFFFF; --surface-2:#ECEEF6; --ink:#1C1A2E; --muted:#66647E; --line:#DADCE8;
  --accent:#4B3BA6; --accent-ink:#FFFFFF; --accent-soft:#E8E5F8; --grid:rgba(75,59,166,.10);
  --ok:#1C8657; --ok-soft:#DCF1E6; --warn:#A8650A; --warn-soft:#FAEED6; --bad:#BA3A2E; --bad-soft:#F7E0DC;
  --plan:#66647E; --plan-soft:#ECECF3; --mk:#1F6FB2; --mk-soft:#DDEBF8;
  --shadow:0 1px 2px rgba(28,26,46,.06),0 8px 24px rgba(28,26,46,.07);
  --display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#13121B; --surface:#1C1B27; --surface-2:#252434; --ink:#ECEAF6; --muted:#A3A0BA; --line:#33324A;
    --accent:#A797F4; --accent-ink:#17142B; --accent-soft:#2B2650; --grid:rgba(167,151,244,.10);
    --ok:#52C48F; --ok-soft:#163427; --warn:#E6A84C; --warn-soft:#382A12; --bad:#EF7D70; --bad-soft:#3B1D1A;
    --plan:#A3A0BA; --plan-soft:#2A2939; --mk:#6FB1EE; --mk-soft:#172C40;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#13121B; --surface:#1C1B27; --surface-2:#252434; --ink:#ECEAF6; --muted:#A3A0BA; --line:#33324A;
  --accent:#A797F4; --accent-ink:#17142B; --accent-soft:#2B2650; --grid:rgba(167,151,244,.10);
  --ok:#52C48F; --ok-soft:#163427; --warn:#E6A84C; --warn-soft:#382A12; --bad:#EF7D70; --bad-soft:#3B1D1A;
  --plan:#A3A0BA; --plan-soft:#2A2939; --mk:#6FB1EE; --mk-soft:#172C40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:1.9rem;font-weight:800}
h2{font-size:1.4rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.55em 1em;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav a:focus-visible,.sess:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:.35em .7em;font-size:.85rem;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
label.f{display:grid;gap:.3rem;font-size:.85rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],input[type=month],input[type=tel],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.55em .75em;font-weight:500;color:var(--ink);min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.8rem}
.stack{display:grid;gap:1rem}
.chip{display:inline-flex;align-items:center;gap:.35em;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.3em .8em;font-size:.85rem;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:.3em;border-radius:999px;padding:.1em .6em;font-size:.75rem;font-weight:700;white-space:nowrap}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.planned{background:var(--plan-soft);color:var(--plan)}
.pill.off_s{background:var(--warn-soft);color:var(--warn)}
.pill.off_t{background:var(--bad-soft);color:var(--bad)}
.pill.mk{background:var(--mk-soft);color:var(--mk)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-inline:16px;
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px}
.auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px}
.logo{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;color:var(--accent);letter-spacing:-.01em}
.logo span{color:var(--ink)}
.logo-sm{font-size:1.45rem}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:.5em;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.err{color:var(--bad);font-size:.88rem;font-weight:600}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:18px;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:.7em;padding:.6em .8em;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;cursor:pointer}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.side .who{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}
.main{padding-block:26px 60px;padding-inline:28px;min-width:0;max-width:1200px;width:100%}
.topbar{display:none}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flat{box-shadow:none}
.saveind{font-size:.78rem;color:var(--muted)}
.saveind.err{color:var(--bad)}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
  .topbar .tb1{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 4px}
  .topbar .nav{display:flex;overflow-x:auto;gap:4px;padding:4px 12px 10px;scrollbar-width:none}
  .topbar .nav::-webkit-scrollbar{display:none}
  .topbar .nav a{flex:none;padding:.45em .8em;font-size:.9rem}
  .main{padding-inline:16px;padding-block:18px 60px}
}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.stat .v{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stat.hero .eyebrow{color:inherit;opacity:.8}

/* ---------- session rows ---------- */
.sess{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.sess:hover{border-color:var(--accent)}
.sess .t{font-variant-numeric:tabular-nums;font-weight:700;min-width:92px}
.sess .n{flex:1;min-width:0}
.sess .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .acts{display:flex;gap:4px;flex-wrap:wrap}
.list{display:grid;gap:8px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* ---------- calendar ---------- */
.calhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calhead .mname{font-family:var(--display);font-weight:800;font-size:1.35rem;min-width:170px;text-align:center}
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px;min-width:720px}
.cal .dh{background:var(--surface-2);padding:8px;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.cal .day{background:var(--surface);min-height:118px;padding:6px;display:flex;flex-direction:column;gap:4px;position:relative}
.cal .day.out{background:var(--surface-2);opacity:.55}
.cal .day .dn{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.cal .day.today .dn span{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 .5em}
.cal .add{border:0;background:transparent;color:var(--muted);cursor:pointer;font-weight:700;border-radius:6px;width:22px;height:22px;line-height:1;opacity:0;transition:opacity .15s}
.cal .day:hover .add,.cal .add:focus-visible{opacity:1}
.cal .add:hover{background:var(--accent-soft);color:var(--accent)}
.ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--plan);background:var(--plan-soft);border-radius:6px;padding:3px 6px;font-size:.74rem;line-height:1.3;cursor:pointer;color:var(--ink)}
.ev b{font-weight:700}
.ev .l2{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.done{border-color:var(--ok);background:var(--ok-soft)}
.ev.off_s{border-color:var(--warn);background:var(--warn-soft)}
.ev.off_t{border-color:var(--bad);background:var(--bad-soft)}
.ev.off_s b,.ev.off_t b{text-decoration:line-through;text-decoration-thickness:1.5px}
.ev.mkb{box-shadow:inset 0 0 0 1px var(--mk)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.agenda{display:grid;gap:14px}
.agenda .dayh{font-weight:700;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.agenda .dayh.today{color:var(--accent)}
@media (max-width:700px){.cal-wrap{display:none}}
@media (min-width:701px){.agenda.mobile-only{display:none}}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);font-weight:700}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:800;background:var(--surface-2)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;min-width:80px;display:flex}
.bar i{display:block;height:100%}

/* ---------- students ---------- */
.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.stu{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start}
.stu.inactive{opacity:.65}
.stu .hd{display:flex;gap:10px;align-items:flex-start}
.avatar{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.15rem;flex:none;color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:.05em .5em;font-size:.78rem;font-weight:700}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,13,30,.5);z-index:100;display:grid;place-items:center;padding:16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:660px;max-height:calc(100vh - 32px);overflow-y:auto;border:1px solid var(--line)}
.modal .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:18px 20px 10px;position:sticky;top:0;background:var(--surface);z-index:1}
.modal .mb{padding:4px 20px 20px;display:grid;gap:14px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface);flex-wrap:wrap}
.xbtn{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1.1rem;line-height:1;flex:none}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.5em .8em;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:.4em}
.seg button.on.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.seg button.on.planned{background:var(--plan-soft);border-color:var(--plan);color:var(--ink)}
.seg button.on.off_s{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.seg button.on.off_t{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.seg button.on.gen{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.slot{display:grid;grid-template-columns:1.15fr .95fr .95fr 1.1fr 1.15fr auto;gap:6px;align-items:center}
.slot-h{display:grid;grid-template-columns:1.15fr .95fr .95fr 1.1fr 1.15fr auto;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.slot-h span:last-child{width:44px}
@media (max-width:560px){.slot{grid-template-columns:1fr 1fr;padding:8px;border:1px solid var(--line);border-radius:10px}.slot-h{display:none}.slot .del{justify-self:end}}
.confirm-box{border:1px solid var(--bad);background:var(--bad-soft);border-radius:10px;padding:12px;display:grid;gap:8px}

/* ---------- invoice ---------- */
.inv-bg{position:fixed;inset:0;background:rgba(15,13,30,.6);z-index:120;display:grid;place-items:center;padding:16px;overflow-y:auto}
.inv-wrap{display:grid;gap:10px;justify-items:center;width:100%;max-width:400px}
.invoice{width:100%;max-width:380px;background:#FFFFFF;color:#1C1A2E;border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3);font-family:var(--body)}
.invoice .ih{padding:18px 20px 14px;background-color:#F1EEFD;background-image:linear-gradient(rgba(75,59,166,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(75,59,166,.12) 1px,transparent 1px);background-size:16px 16px;border-bottom:2px dashed #CFC8F2}
.invoice .ih .logo{font-size:1.25rem;color:#4B3BA6}
.invoice .ih .logo span{color:#1C1A2E}
.invoice .ih h3{font-size:1.35rem;margin-top:6px;color:#1C1A2E;letter-spacing:.02em}
.invoice .ib{padding:14px 20px 18px;display:grid;gap:12px}
.invoice .ikv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.88rem}
.invoice .ikv dt{color:#66647E}
.invoice .ikv dd{margin:0;font-weight:700;text-align:right}
.invoice .dates{display:flex;flex-wrap:wrap;gap:4px}
.invoice .dates span{background:#E8E5F8;color:#4B3BA6;border-radius:6px;padding:1px 6px;font-size:.76rem;font-weight:700;font-variant-numeric:tabular-nums}
.invoice .dates span.x{background:#F3F3F6;color:#9A98AE;text-decoration:line-through}
.invoice .total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #E2E2EC;padding-top:10px}
.invoice .total b{font-family:var(--display);font-size:1.7rem;color:#4B3BA6;font-variant-numeric:tabular-nums}
.invoice .qr{display:grid;justify-items:center;gap:6px;background:#F7F7FB;border-radius:12px;padding:12px}
.invoice .qr img{width:190px;height:190px;object-fit:contain;background:#fff;border-radius:8px}
.invoice .foot{font-size:.78rem;color:#66647E;text-align:center}
.invoice .ck{font-family:ui-monospace,Menlo,monospace;background:#fff;border:1px dashed #CFC8F2;border-radius:6px;padding:2px 8px;font-weight:700;font-size:.82rem}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:200;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
.qr-prev{width:160px;height:160px;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;overflow:hidden;background:var(--surface-2)}
.qr-prev img{width:100%;height:100%;object-fit:contain;background:#fff}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.timeline{display:grid;gap:10px}
.tl{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);display:grid;gap:6px}
.tl .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.stars{display:inline-flex;gap:2px}
.stars i{width:10px;height:10px;border-radius:2px;background:var(--surface-2);display:inline-block}
.stars i.on{background:var(--accent)}
/* ---------- progress table ---------- */
.pt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.pt{min-width:980px;table-layout:fixed}
.pt textarea.note{color:var(--warn)}
.pt th{white-space:normal;line-height:1.3;vertical-align:bottom}
.pt th.c{text-align:center}
.pt td{white-space:normal;vertical-align:top;padding:6px;border-right:1px solid var(--line)}
.pt td:last-child,.pt th:last-child{border-right:0}
.pt tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.pt input[type=date],.pt select,.pt textarea{border:1px solid transparent;background:transparent;border-radius:6px;padding:.4em .5em;width:100%;font-size:.88rem}
.pt input[type=date]:hover,.pt select:hover,.pt textarea:hover{border-color:var(--line)}
.pt input[type=date]:focus,.pt select:focus,.pt textarea:focus{border-color:var(--accent);background:var(--surface)}
.pt textarea{min-height:58px;resize:none;overflow:hidden;line-height:1.45}
.pt .stt{text-align:center;font-weight:700;color:var(--muted);padding-top:13px;font-variant-numeric:tabular-nums}
.pt .wd{display:block;font-size:.74rem;color:var(--muted);padding:0 .55em}
.pt .cx{text-align:center}

async function kvGet(k){
  if(k in Store.cache) return Store.cache[k];

  if(Store.mode==='supa'){

    let lastErr;

      try{ const s=await docRef(k).get(); v = s.exists ? JSON.parse(JSON.stringify(s.data())) : null; lastErr=null; break; }

    }
    if(lastErr) throw lastErr;
  } else v = lsGet(k);

  return v;

function setSaveInd(){ $$('.saveind').forEach(el=>{ el.classList.toggle('err', Store.error); el.textContent = Store.error ? 'Lỗi lưu dữ liệu' : (Store.saving ? 'Đang lưu…' : (Store.mode==='cloud' ? 'Đã lưu lên tài khoản' : Store.mode==='supa' ? 'Đã lưu lên máy chủ' : 'Đã lưu trên trình duyệt này')); }); }

  }
  if(Store.mode==='cloud'){
    const body = JSON.parse(JSON.stringify(v));
    try{ await docRef(k).set(body); }
    catch(e){ if(e && e.code==='unavailable'){ await sleep(400+Math.random()*600); await docRef(k).set(body); } else throw e; }
  } else lsSet(k,v);
}
function kvSet(k,v){
  Store.cache[k]=v;
  const q = Store.q[k] || (Store.q[k]={busy:false,pending:undefined});
  q.pending = v;
  if(q.busy) return q.done;
  q.busy=true; Store.saving++; setSaveInd();
  q.done = (async()=>{
    while(q.pending!==undefined){
      const val=q.pending; q.pending=undefined;
      try{ await backendSet(k,val); Store.error=false; }
      catch(e){ console.warn('save',k,e); Store.error=true;
        if(e && e.code==='quota_exceeded') toast('Bộ nhớ đã đầy — hãy xóa bớt dữ liệu cũ.');
        else if(e && e.code==='invalid_argument') toast('Không lưu được: bạn chỉ có quyền xem trang này.');
        else toast('Không lưu được dữ liệu. Kiểm tra kết nối rồi thử lại.'); }
    }
    q.busy=false; Store.saving--; setSaveInd();
  })();
  return q.done;
}
async function kvDel(k){ delete Store.cache[k]; if(Store.mode==='supa'){ await Store.sb.from('kv').delete().eq('key',k); return; } if(Store.mode==='cloud'){ try{ await docRef(k).delete(); }catch(e){} } else lsDel(k); }

async function sha(s){
  try{ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let h1=0x811c9dc5,h2=0x1234567; for(let i=0;i<s.length;i++){ h1=Math.imul(h1^s.charCodeAt(i),16777619); h2=Math.imul(h2^s.charCodeAt(i),2246822507);} return 'f'+(h1>>>0).toString(16)+(h2>>>0).toString(16); }
}

const feeGroups = list => { const m=new Map(); list.forEach(s=>{ const f=feeOf(s); m.set(f,(m.get(f)||0)+1); }); return [...m.entries()].sort((a,b)=>b[0]-a[0]); };

/* ================= sessions ================= */
function mkSession(key, rec, base){
  const src = rec ? Object.assign({}, base, {sid:rec.sid??base.sid, d:rec.d??base.d, t1:rec.t1??base.t1, t2:rec.t2??base.t2, sub:rec.sub??base.sub}) : base;
  const sfee = (rec && rec.sfee!=null) ? rec.sfee : base.sfee;
  return { key, sid:src.sid, d:src.d, t1:src.t1||'', t2:src.t2||'', sub:src.sub||'', sfee: (sfee!=null && sfee!=='') ? Number(sfee) : null, s: rec?.s || 'planned', mk: !!rec?.mk, p: rec?.p || null, fee: rec?.fee, note: rec?.note || '', from: rec?.from || '' };
}
function sessionsFromMonth(ym, md){
  const out=[]; const seen=new Set();
  const [y,m]=ym.split('-').map(Number); const days=new Date(y,m,0).getDate();
  for(let d=1; d<=days; d++){
    const ds=`${ym}-${pad(d)}`; const dow=new Date(y,m-1,d).getDay();
    for(const st of App.students){
      if(st.startDate && ds<st.startDate) continue;
      if(st.endDate && ds>st.endDate) continue;
      for(const sl of (st.slots||[])){
        if(Number(sl.dow)!==dow) continue;
        const key=`${st.id}_${ds}_${sl.id}`; seen.add(key);
        out.push(mkSession(key, md.ss[key], {sid:st.id, d:ds, t1:sl.t1, t2:sl.t2, sub:sl.sub, sfee: slotFee(st, sl)}));
      }
    }
  }
  for(const [key,rec] of Object.entries(md.ss)){
    if(seen.has(key) || !rec || !stuById(rec.sid)) continue;
    if(!rec.mk && (rec.s||'planned')==='planned' && !rec.p) continue; // stale unedited record
    out.push(mkSession(key, rec, rec));
  }
  out.sort((a,b)=> (a.d+a.t1).localeCompare(b.d+b.t1));
  return out;
}
async function sessionsForMonth(ym){ return sessionsFromMonth(ym, await getMonth(ym)); }
async function sessionsInRange(from, to){
  const all=[]; for(const ym of monthsBetween(from,to)){ all.push(...(await sessionsForMonth(ym))); }
  return all.filter(s=>s.d>=from && s.d<=to);
}
const feeOf = s => (s.fee!=null ? Number(s.fee) : (s.sfee!=null ? Number(s.sfee) : Number(stuById(s.sid)?.fee||0)));
async function updateSession(sess, patch){
  const ym=sess.d.slice(0,7); const md=await getMonth(ym);
  const rec = md.ss[sess.key] || {sid:sess.sid, d:sess.d, t1:sess.t1, t2:sess.t2, sub:sess.sub};
  Object.assign(rec, patch);
  if(patch.s){
    if(patch.s==='done'){ if(rec.fee==null) rec.fee = feeOf(Object.assign({}, sess, {fee:null})); }
    else delete rec.fee;
  }
  md.ss[sess.key]=rec;
  saveMonth(ym);
}
async function addMakeup(data){
  const ym=data.d.slice(0,7); const md=await getMonth(ym);
  const key='mk'+uid();
  md.ss[key]={sid:data.sid, d:data.d, t1:data.t1, t2:data.t2, sub:data.sub, sfee:Number(data.fee)||0, mk:1, s:'planned', from:data.from||'', note:data.note||''};
  saveMonth(ym);
  return key;
}
async function deleteRecord(sess){
  const ym=sess.d.slice(0,7); const md=await getMonth(ym);
  delete md.ss[sess.key]; saveMonth(ym);
}

        ${tab==='register' ? `<label class="f">Họ tên gia sư<input type="text" id="a_name" required maxlength="60" placeholder="VD: Nguyễn Thu Hà"></label>`:''}
        ${tab==='forgot' ? `<p class="small muted">Nhập email đã đăng ký. Chúng tôi sẽ gửi link để đặt lại mật khẩu.</p>`:''}
        <label class="f">Email<input type="email" id="a_email" required autocomplete="email" placeholder="ban@gmail.com" maxlength="120" style="width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.55em .75em;font-weight:500;color:var(--ink)"></label>
        ${tab!=='forgot' ? `<label class="f">Mật khẩu<input type="password" id="a_pw" required autocomplete="${tab==='register'?'new-password':'current-password'}" minlength="6" placeholder="Ít nhất 6 ký tự"></label>`:''}
        ${tab==='register' ? `<label class="f">Nhập lại mật khẩu<input type="password" id="a_pw2" required autocomplete="new-password" minlength="6"></label>`:''}`}
        ${err?`<div class="err" role="alert">${esc(err)}</div>`:''}
        ${info?`<div class="small" role="status" style="color:var(--ok);font-weight:600">${esc(info)}</div>`:''}
        <button class="btn primary" type="submit" id="a_btn">${{login:'Đăng nhập',register:'Tạo tài khoản',forgot:'Gửi link đặt lại mật khẩu',newpw:'Lưu mật khẩu mới'}[tab]}</button>
        ${tab==='login'?`<button type="button" class="btn ghost sm" data-auth="forgot" style="justify-self:start">Quên mật khẩu?</button>`:''}
        ${tab==='forgot'?`<button type="button" class="btn ghost sm" data-auth="login" style="justify-self:start">← Quay lại đăng nhập</button>`:''}
      </form>
      <p class="small muted">Dữ liệu được lưu trên máy chủ, đăng nhập ở máy nào cũng thấy. Mỗi gia sư chỉ xem được dữ liệu của mình.</p>
    </div>
  </div>`;
  $$('[data-auth]').forEach(b=>b.onclick=()=>{ authTab=b.dataset.auth; renderAuthSupa(); });
  $('#authForm').onsubmit = async e => {
    e.preventDefault();
    const btn=$('#a_btn'); btn.disabled=true;
    const sb=Store.sb; const g=id=>($(id)?.value||'');
    const email=g('#a_email').trim().toLowerCase(); const pw=g('#a_pw');
    try{
      if(tab==='login'){
        const {data,error}=await sb.auth.signInWithPassword({email, password:pw});
        if(error) throw error;
        Store.supaUid=data.user.id; Store.supaUser=data.user; await enterApp('me');
      } else if(tab==='register'){
        const name=g('#a_name').trim();
        if(!name) throw new Error('Nhập họ tên gia sư.');
        if(pw.length<6) throw new Error('Mật khẩu cần ít nhất 6 ký tự.');
        if(pw!==g('#a_pw2')) throw new Error('Hai mật khẩu chưa khớp.');
        const {data,error}=await sb.auth.signUp({email, password:pw, options:{data:{name}, emailRedirectTo: location.origin+location.pathname}});
        if(error) throw error;
        if(data.user && Array.isArray(data.user.identities) && data.user.identities.length===0) throw new Error('Email này đã có tài khoản. Chuyển sang Đăng nhập nhé.');
        if(data.session){ Store.supaUid=data.user.id; Store.supaUser=data.user; await enterApp('me'); }
        else { authTab='login'; renderAuthSupa('', `Đã gửi email xác nhận tới ${email}. Mở hộp thư (kể cả mục Spam), bấm link xác nhận rồi quay lại đăng nhập.`); }
      } else if(tab==='forgot'){
        const {error}=await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin+location.pathname});
        if(error) throw error;
        renderAuthSupa('', `Nếu ${email} đã đăng ký, bạn sẽ nhận được email đặt lại mật khẩu trong vài phút.`);
      } else if(tab==='newpw'){
        if(pw.length<6) throw new Error('Mật khẩu cần ít nhất 6 ký tự.');
        if(pw!==g('#a_pw2')) throw new Error('Hai mật khẩu chưa khớp.');
        const {data,error}=await sb.auth.updateUser({password:pw});
        if(error) throw error;
        try{ history.replaceState(null,'',location.pathname); }catch(_){}
        Store.supaUid=data.user.id; Store.supaUser=data.user; toast('Đã đổi mật khẩu'); await enterApp('me');
      }
    }catch(er){ renderAuthSupa(SUPA_ERR(er.message)); }
  };
}
function renderAuth(err=''){
  if(Store.mode==='supa') return renderAuthSupa(err);
  const cloud = Store.mode==='cloud';
  $('#app').innerHTML = `
  <div class="auth">
    <div class="auth-card stack">
      <div class="stack" style="gap:6px">
        <div class="logo">giasu<span>chillchill</span></div>
        <p class="muted">Sổ tay của gia sư: học sinh, lịch dạy, tiến độ và học phí ở cùng một chỗ.</p>
      </div>
      <div class="tabs" role="tablist">
        <button type="button" data-auth="login" class="${authTab==='login'?'on':''}">Đăng nhập</button>
        <button type="button" data-auth="register" class="${authTab==='register'?'on':''}">Đăng ký</button>
      </div>
      <form id="authForm" class="stack" style="gap:12px" autocomplete="on">
        ${authTab==='register' ? `<label class="f">Họ tên gia sư<input type="text" id="a_name" required maxlength="60" placeholder="VD: Nguyễn Thu Hà"></label>`:''}
        <label class="f">Tên đăng nhập<input type="text" id="a_user" required autocomplete="username" placeholder="chữ thường, số, dấu _" maxlength="24"></label>
        <label class="f">Mật khẩu<input type="password" id="a_pw" required autocomplete="${authTab==='register'?'new-password':'current-password'}" minlength="6" placeholder="Ít nhất 6 ký tự"></label>
        ${authTab==='register' ? `<label class="f">Nhập lại mật khẩu<input type="password" id="a_pw2" required autocomplete="new-password" minlength="6"></label>`:''}
        <label class="row small" style="gap:8px;font-weight:500"><input type="checkbox" id="a_rem" checked> Ghi nhớ đăng nhập trên thiết bị này</label>
        ${err?`<div class="err" role="alert">${esc(err)}</div>`:''}
        <button class="btn primary" type="submit" id="a_btn">${authTab==='register'?'Tạo tài khoản':'Đăng nhập'}</button>
      </form>
      <p class="small muted">${cloud ? 'Dữ liệu được lưu riêng trong tài khoản Claude của bạn, mở trên thiết bị nào cũng thấy.' : 'Dữ liệu được lưu trong trình duyệt này. Nhớ sao lưu định kỳ trong phần Cài đặt.'}</p>
    </div>
  </div>`;
  $$('[data-auth]').forEach(b=>b.onclick=()=>{ authTab=b.dataset.auth; renderAuth(); });
  $('#authForm').onsubmit = async e => {
    e.preventDefault();
    const btn=$('#a_btn'); btn.disabled=true;
    const u=$('#a_user').value.trim().toLowerCase(); const pw=$('#a_pw').value; const rem=$('#a_rem').checked;
    try{
      if(!/^[a-z0-9_]{3,24}$/.test(u)) throw new Error('Tên đăng nhập gồm 3–24 ký tự: chữ thường không dấu, số hoặc dấu _.');
      const acc = (await kvGet(K.accounts)) || {users:{}};
      if(!acc.users) acc.users={};
      if(authTab==='register'){
        const name=$('#a_name').value.trim(); const pw2=$('#a_pw2').value;
        if(!name) throw new Error('Nhập họ tên gia sư.');
        if(pw.length<6) throw new Error('Mật khẩu cần ít nhất 6 ký tự.');
        if(pw!==pw2) throw new Error('Hai mật khẩu chưa khớp.');
        if(acc.users[u]) throw new Error('Tên đăng nhập này đã có. Chọn tên khác hoặc chuyển sang Đăng nhập.');
        const salt=randHex();
        acc.users[u]={salt, hash: await sha(salt+pw), name, created: Date.now()};
        await kvSet(K.accounts, acc);
        await kvSet(K.profile(u), {displayName:name, phone:'', bankName:'', bankAcc:'', bankOwner:'', qr:'', payNote:''});
        await kvSet(K.students(u), {list:[]});
        if(Store.error) throw new Error('Chưa lưu được tài khoản. Kiểm tra kết nối rồi thử lại.');
      } else {
        const rec=acc.users[u];
        if(!rec) throw new Error('Không tìm thấy tài khoản này. Bạn đã đăng ký chưa?');
        if(await sha(rec.salt+pw)!==rec.hash) throw new Error('Mật khẩu chưa đúng.');
      }
      sessSet(u, rem);
      await enterApp(u);
    }catch(err){ renderAuth(err.message || 'Không kết nối được dữ liệu. Thử lại sau giây lát.'); }
  };
}

async function enterApp(u){
  App.u=u;
  App.handle = Store.mode==='supa' ? (Store.supaUser?.email||'') : '@'+u;
  const [p, s] = await Promise.all([kvGet(K.profile(u)), kvGet(K.students(u))]);
  App.profile = p || {displayName: (Store.mode==='supa' ? (Store.supaUser?.user_metadata?.name || (Store.supaUser?.email||'').split('@')[0]) : u), phone:'', bankName:'', bankAcc:'', bankOwner:'', qr:'', payNote:''};
  if(!p) Store.cache[K.profile(u)] = App.profile;
  App.students = (s && Array.isArray(s.list)) ? s.list : [];
  if(!s) Store.cache[K.students(u)] = {list:App.students};
  else Store.cache[K.students(u)].list = App.students;
  let hash=''; try{ hash=location.hash.replace('#',''); }catch(e){}
  if(NAV.some(n=>n.k===hash)) App.view=hash;
  renderShell();
}

VIEWS.home = async () => {
  const ym=curYM(); const today=todayStr();
  const ss = await sessionsForMonth(ym);
  const prev = await sessionsForMonth(addMonths(ym,-1));
  const todays = ss.filter(s=>s.d===today && s.s!=='off_t');
  const pending = [...prev, ...ss].filter(s=>s.d<today && s.s==='planned');
  const done = ss.filter(s=>s.s==='done');
  const planned = ss.filter(s=>s.s==='planned');
  const expected = [...done,...planned].reduce((a,s)=>a+feeOf(s),0);
  const earned = done.reduce((a,s)=>a+feeOf(s),0);
  const upcoming = ss.filter(s=>s.d>today && s.s==='planned').slice(0,6);
  const active = App.students.filter(s=>!s.endDate || s.endDate>=today).length;
  const hi = new Date().getHours(); const greet = hi<11?'Chào buổi sáng':hi<14?'Chào buổi trưa':hi<18?'Chào buổi chiều':'Chào buổi tối';
  if(!App.students.length){
    return `<div class="pagehead"><div><div class="eyebrow">${greet}</div><h1>${esc(App.profile.displayName||'')}</h1></div></div>
    <div class="card stack" style="max-width:620px">

      <p class="muted">Thêm học sinh cùng lịch học hằng tuần và học phí mỗi buổi. Lịch dạy, thu nhập dự kiến và học phí sẽ tự tính từ đó.</p>
      <div class="row"><button class="btn primary" data-act="addStudent">+ Thêm học sinh</button><button class="btn" data-go="settings">Thêm mã QR nhận tiền</button></div>
    </div>`;
  }
  return `
  <div class="pagehead"><div><div class="eyebrow">${greet} · ${fmtFull(today)}</div><h1>${esc(App.profile.displayName||'')}</h1></div>
    <button class="btn primary" data-act="addStudent">+ Thêm học sinh</button></div>
  <div class="stats" style="margin-bottom:22px">
    <div class="stat hero"><span class="eyebrow">Dự kiến ${ymLabel(ym).toLowerCase()}</span><span class="v">${money(expected)}</span><span class="small">đã dạy ${money(earned)}</span></div>
    <div class="stat"><span class="eyebrow">Buổi đã dạy</span><span class="v">${done.length}</span><span class="small muted">còn ${planned.filter(s=>s.d>=today).length} buổi theo lịch</span></div>
    <div class="stat"><span class="eyebrow">Học sinh đang dạy</span><span class="v">${active}</span><span class="small muted">tổng ${App.students.length} hồ sơ</span></div>
    <div class="stat"><span class="eyebrow">Chưa ghi nhận</span><span class="v" style="color:${pending.length?'var(--warn)':'inherit'}">${pending.length}</span><span class="small muted">buổi đã qua chưa đánh dấu</span></div>

/* ---------- calendar ---------- */
VIEWS.calendar = async () => {
  const ym=App.calYM; const today=todayStr();
  let ss = await sessionsForMonth(ym);
  if(App.calFilter) ss = ss.filter(s=>s.sid===App.calFilter);
  const byDay={}; ss.forEach(s=>(byDay[s.d]=byDay[s.d]||[]).push(s));
  const [y,m]=ym.split('-').map(Number);
  const first=new Date(y,m-1,1); const startOffset=(first.getDay()+6)%7; // Monday first
  const start=new Date(y,m-1,1-startOffset);
  const days=new Date(y,m,0).getDate();
  const cells=Math.ceil((startOffset+days)/7)*7;
  let grid=['T2','T3','T4','T5','T6','T7','CN'].map(d=>`<div class="dh">${d}</div>`).join('');
  for(let i=0;i<cells;i++){
    const d=new Date(start); d.setDate(start.getDate()+i); const ds=ymd(d); const inM=d.getMonth()===m-1;
    const evs=(inM?byDay[ds]:null)||[];
    grid+=`<div class="day ${inM?'':'out'} ${ds===today?'today':''}">
      <div class="dn"><span>${d.getDate()}</span>${inM?`<button class="add" data-addmk="${ds}" title="Thêm buổi dạy bù ngày ${fmtDD(ds)}" aria-label="Thêm buổi dạy bù ngày ${fmtDD(ds)}">+</button>`:''}</div>
      ${evs.map(s=>{const st=stuById(s.sid); return `<button class="ev ${s.s} ${s.mk?'mkb':''}" data-sess="${esc(s.key)}" data-d="${s.d}" style="${s.s==='planned'&&st?.color?`border-left-color:${st.color}`:''}"><b>${esc(s.t1)} ${esc(st?.name||'?')}</b><span class="l2">L${esc(st?.grade||'')} · ${esc(s.sub)}${s.mk?' · bù':''}</span></button>`;}).join('')}
    </div>`;
  }
  const days2=Object.keys(byDay).sort();
  const agenda = days2.length ? days2.map(ds=>`<div><div class="dayh ${ds===today?'today':''}"><span>${DOW_FULL[parseD(ds).getDay()]}, ${fmtFull(ds)}</span><button class="btn sm ghost" data-addmk="${ds}">+ Bù</button></div><div class="list">${byDay[ds].map(s=>sessRow(s)).join('')}</div></div>`).join('') : '<div class="empty">Tháng này chưa có buổi dạy nào.</div>';
  const cnt = k => ss.filter(s=>s.s===k).length;
  return `
  <div class="pagehead"><div><div class="eyebrow">Lịch dạy</div><h1>${ymLabel(ym)}</h1></div>
    <div class="row"><button class="btn" data-addmk="${ym===curYM()?today:ym+'-01'}">+ Thêm buổi dạy bù</button></div></div>
  <div class="row" style="justify-content:space-between;margin-bottom:12px">
    <div class="calhead">
      <button class="btn sm" data-cal="-1" aria-label="Tháng trước">‹</button>
      <input type="month" id="calMonth" value="${ym}" style="width:auto">
      <button class="btn sm" data-cal="1" aria-label="Tháng sau">›</button>
      <button class="btn sm ghost" data-cal="0">Hôm nay</button>
    </div>
    <select id="calFilter" style="width:auto;min-width:180px"><option value="">Tất cả học sinh</option>${App.students.map(s=>`<option value="${s.id}" ${App.calFilter===s.id?'selected':''}>${esc(s.name)} · L${esc(s.grade)}</option>`).join('')}</select>
  </div>
  <div class="legend" style="margin-bottom:10px">
    <span><i style="background:var(--plan)"></i>Theo lịch (${cnt('planned')})</span>
    <span><i style="background:var(--ok)"></i>Đã dạy (${cnt('done')})</span>
    <span><i style="background:var(--warn)"></i>HS nghỉ (${cnt('off_s')})</span>
    <span><i style="background:var(--bad)"></i>GS nghỉ (${cnt('off_t')})</span>
    <span><i style="background:transparent;box-shadow:inset 0 0 0 1.5px var(--mk)"></i>Dạy bù (${ss.filter(s=>s.mk).length})</span>
  </div>
  <div class="cal-wrap"><div class="cal">${grid}</div></div>
  <div class="agenda mobile-only">${agenda}</div>
  <p class="small muted" style="margin-top:10px">Bấm vào một buổi để đánh dấu đã dạy hay nghỉ và ghi tiến độ. Bấm “+” trên một ngày để thêm buổi dạy bù.</p>`;
};
AFTER.calendar = () => {
  $$('[data-cal]').forEach(b=>b.onclick=()=>{ const n=Number(b.dataset.cal); App.calYM = n===0?curYM():addMonths(App.calYM,n); renderMain(); });
  const mi=$('#calMonth'); if(mi) mi.onchange=()=>{ if(mi.value){ App.calYM=mi.value; renderMain(); } };

      saveStudents(); closeModal(); toast(isNew?`Đã thêm ${s.name}`:'Đã lưu thay đổi'); renderMain();
    };
  };
  draw();
}

async function openSession(key, d){
  const ym=d.slice(0,7);
  const ss = await sessionsForMonth(ym);
  const s = ss.find(x=>x.key===key); if(!s) return toast('Không tìm thấy buổi học này.');
  const st = stuById(s.sid);
  const rows = await getTable(ym, s.sid);
  let row = rows.find(r=>r.key===s.key) || rows.find(r=>r.d===s.d && !r.key);
  const pr = row ? Object.assign({}, row, {subs:[...(row.subs||[])]}) : rowFromSession(s);
  const p = {reason: s.p?.reason||'', note: s.p?.note||''};
  if(!pr.note && p.note) pr.note=p.note;
  let status = s.s; let confirmDel=false;
  const draw = () => {
    const opts=[...new Set([...(st?.subjects||[]), ...pr.subs])];
    openModal(`
      <div class="mh"><div><div class="eyebrow">${DOW_FULL[parseD(s.d).getDay()]}, ${fmtFull(s.d)} · ${esc(s.t1)}–${esc(s.t2)}${s.mk?' · Dạy bù':''}</div>
        <h2>${esc(st?.name||'?')}</h2><div class="small muted">Lớp ${esc(st?.grade||'')} · ${esc(s.sub)} · ${money(feeOf(s))}/buổi</div></div>
        <button class="xbtn" data-close aria-label="Đóng">×</button></div>
      <form id="sessForm"><div class="mb">
        <div class="stack" style="gap:6px"><span class="eyebrow">Tình trạng buổi học</span>
          <div class="seg">${Object.keys(STATUS).map(k=>`<button type="button" class="${k} ${status===k?'on':''}" data-st="${k}">${STATUS[k].label}</button>`).join('')}</div></div>
        ${status==='off_s'||status==='off_t' ? `
          <label class="f">Lý do nghỉ<input type="text" id="p_reason" value="${esc(p.reason)}" maxlength="120" placeholder="VD: ốm, đi thi, về quê…"></label>
          <div class="row"><button type="button" class="btn sm" id="p_makeup">+ Xếp buổi dạy bù</button><span class="small muted">Buổi nghỉ không tính học phí.</span></div>` : `
        <div class="stack" style="gap:12px">
          <span class="eyebrow">Tiến độ buổi học <span style="text-transform:none;letter-spacing:0;font-weight:500">· lưu vào bảng Tiến độ</span></span>
          <div class="stack" style="gap:6px"><span class="f" style="font-size:.85rem;font-weight:600;color:var(--muted)">Môn học</span>
            <div class="row" style="gap:6px">${opts.map(n=>`<button type="button" class="chip subjchip ${pr.subs.includes(n)?'on':''}" data-psub="${esc(n)}" style="--c:${subjColor(n)}">${esc(n)}</button>`).join('')}</div></div>
          <div class="stack" style="gap:6px"><span class="f" style="font-size:.85rem;font-weight:600;color:var(--muted)">BTVN buổi trước làm được</span>
            <div class="seg">${HWP.map(([v,l])=>`<button type="button" class="gen ${pr.hwPrev===v?'on':''}" data-hwp="${v}">${l}</button>`).join('')}</div></div>
          <label class="f">Nội dung buổi học<textarea id="p_lesson" maxlength="1000" placeholder="VD: Bài 5 — Phương trình bậc nhất một ẩn, làm bài 1–6 SGK">${esc(pr.lesson)}</textarea></label>
          <label class="f">Bài tập về nhà<textarea id="p_hw" maxlength="600" placeholder="VD: Bài 7–10 trang 42">${esc(pr.hw)}</textarea></label>
          <label class="f">Lưu ý<textarea id="p_note" maxlength="600" placeholder="VD: cần ôn lại phân số, sắp kiểm tra giữa kỳ…">${esc(pr.note||'')}</textarea></label>
        </div>`}
        ${s.mk ? `<div class="row"><button type="button" class="btn sm danger" id="p_del">Xóa buổi dạy bù này</button></div>
          ${confirmDel?`<div class="confirm-box"><b>Xóa buổi dạy bù ngày ${fmtFull(s.d)}?</b><div class="row"><button type="button" class="btn sm danger" id="p_delyes">Xóa</button><button type="button" class="btn sm" id="p_delno">Giữ lại</button></div></div>`:''}`:''}
      </div>
      <div class="mf"><button type="button" class="btn" data-close>Hủy</button><button type="submit" class="btn primary">Lưu buổi học</button></div></form>`);
    const read = () => { const g=id=>$(id)?.value; if($('#p_reason')) p.reason=g('#p_reason'); if($('#p_lesson')){ pr.lesson=g('#p_lesson'); pr.hw=g('#p_hw'); pr.note=g('#p_note'); } };
    $$('[data-st]').forEach(b=>b.onclick=()=>{ read(); status=b.dataset.st; draw(); });
    $$('[data-psub]').forEach(b=>b.onclick=()=>{ read(); const n=b.dataset.psub; pr.subs = pr.subs.includes(n)? pr.subs.filter(x=>x!==n) : [...pr.subs,n]; draw(); });
    $$('[data-hwp]').forEach(b=>b.onclick=()=>{ read(); pr.hwPrev = pr.hwPrev===b.dataset.hwp?'':b.dataset.hwp; draw(); });
    const mkb=$('#p_makeup'); if(mkb) mkb.onclick=async()=>{ read(); await commit(); openMakeup({sid:s.sid, sub:s.sub, t1:s.t1, t2:s.t2, fee:feeOf(s), from:s.key, fromD:s.d}); };
    const del=$('#p_del'); if(del) del.onclick=()=>{ read(); confirmDel=true; draw(); };
    const dy=$('#p_delyes'); if(dy) dy.onclick=async()=>{ const i=rows.findIndex(r=>r.key===s.key); if(i>=0) rows.splice(i,1); await deleteRecord(s); closeModal(); toast('Đã xóa buổi dạy bù'); renderMain(); };
    const dn=$('#p_delno'); if(dn) dn.onclick=()=>{ confirmDel=false; draw(); };
    $('#sessForm').onsubmit = async e => { e.preventDefault(); read(); await commit(); closeModal(); toast(`Đã lưu: ${STATUS[status].label}`); renderMain(); };
  };
  const commit = async () => {
    const off = status==='off_s'||status==='off_t';
    if(off){
      if(row && !row.lesson?.trim() && !row.hw?.trim() && !row.hwPrev && !row.note?.trim()){ const i=rows.indexOf(row); if(i>=0) rows.splice(i,1); row=null; }
    } else {
      pr.lesson=(pr.lesson||'').trim(); pr.hw=(pr.hw||'').trim(); pr.note=(pr.note||'').trim(); pr.key=s.key; if(!pr.d) pr.d=s.d;
      if(row) Object.assign(row, pr); else { row=pr; rows.push(pr); sortRows(rows); }
    }
    const clean={}; if(off && p.reason.trim()) clean.reason=p.reason.trim(); 
    await updateSession(s, {s:status, p: Object.keys(clean).length?clean:null});
  };
  draw();
}
async function quickMark(key, d, status){
  const ss = await sessionsForMonth(d.slice(0,7)); const s=ss.find(x=>x.key===key); if(!s) return;
  await updateSession(s, {s:status});
  toast(`${stuById(s.sid)?.name||''}: ${STATUS[status].label}`);
  renderMain();
}

const EXTRA_COLORS = ['#D6336C','#0B7285','#5F3DC4','#E67700','#2B8A3E','#C2255C','#1864AB'];
const subjColor = n => SUBJ_COLORS[n] || EXTRA_COLORS[[...String(n)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7)%EXTRA_COLORS.length];
const subjTag = n => `<span class="stag" style="--c:${subjColor(n)}">${esc(n)}</span>`;
const oldHw = h => ({full:'100', part:'50'})[h] || '';
function rowFromSession(s){ return {id:uid(), key:s.key, d:s.d, subs:[s.sub].filter(Boolean), hwPrev: oldHw(s.p?.hw), lesson: s.p?.lesson||'', hw: s.p?.hwNew||'', note: s.p?.note||''}; }
const sortRows = rows => rows.sort((a,b)=>(a.d||'9999').localeCompare(b.d||'9999'));
async function getTable(ym, sid){
  const md=await getMonth(ym); if(!md.pt || typeof md.pt!=='object') md.pt={};
  if(!Array.isArray(md.pt[sid]) || !md.pt[sid].length){

  }

async function copyText(t, ok){
  try{ await navigator.clipboard.writeText(t); toast(ok); }
  catch(e){ openModal(`<div class="mh"><h3>Sao chép thủ công</h3><button class="xbtn" data-close aria-label="Đóng">×</button></div><div class="mb"><p class="small muted">Trình duyệt chặn sao chép tự động. Chọn toàn bộ nội dung bên dưới và sao chép.</p><textarea id="cpy" style="min-height:260px">${esc(t)}</textarea></div>`); const ta=$('#cpy'); ta.focus(); ta.select(); }
}

/* ---------- fee ---------- */
async function computeFee(){
  const F=App.fee; const st=stuById(F.sid);
  let from, to, label;
  if(F.mode==='month'){ const [y,m]=F.ym.split('-').map(Number); from=`${F.ym}-01`; to=`${F.ym}-${pad(new Date(y,m,0).getDate())}`; label=ymLabel(F.ym); }
  else { from=F.from; to=F.to; if(from>to) [from,to]=[to,from]; label=`${fmtFull(from)} – ${fmtFull(to)}`; }
  const ss=(await sessionsInRange(from,to)).filter(s=>s.sid===st.id);
  const done=ss.filter(s=>s.s==='done'); const planned=ss.filter(s=>s.s==='planned'); const off=ss.filter(s=>s.s==='off_s'||s.s==='off_t');
  const charged = F.incPlanned ? [...done,...planned].sort((a,b)=>(a.d+a.t1).localeCompare(b.d+b.t1)) : done;
  const base = charged.reduce((a,s)=>a+feeOf(s),0);
  const adj = Number(F.adj)||0;
  const fees=[...new Set(charged.map(feeOf))];
  return {st, from, to, label, ss, done, planned, off, charged, base, adj, total: base+adj, fees};
}

  on('#f_to','onchange',e=>{ if(e.target.value){ F.to=e.target.value; renderMain(); } });

    sv.disabled=false;
  };
}

      Store.cache[K.students(App.u)]={list:App.students};
      kvSet(K.profile(App.u), App.profile); kvSet(K.students(App.u), {list:App.students});
      for(const [ym,v] of Object.entries(data.months||{})){ if(/^\d{4}-\d{2}$/.test(ym) && v && v.ss) kvSet(K.month(App.u,ym), {ss:v.ss}); }
      toast('Đã khôi phục dữ liệu'); renderShell();
    };
  };
};
function canSave(){ return !!Store.downloads || !window.claude; }
async function saveFile({filename, data}){
  if(Store.downloads) return Store.downloads.save({filename, data});
  const blob = data instanceof Blob ? data : new Blob([data], {type: filename.endsWith('.json')?'application/json':'application/octet-stream'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function shrinkImage(file, max){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{ const img=new Image(); img.onerror=rej; img.onload=()=>{
      const sc=Math.min(1, max/Math.max(img.width,img.height)); const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
      const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.imageSmoothingEnabled=sc<1; x.drawImage(img,0,0,w,h);
      let out=c.toDataURL('image/png'); if(out.length>180000) out=c.toDataURL('image/jpeg',0.9); res(out);
    }; img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

/* ================= modal ================= */
let lastFocus=null;
function openModal(html){
  const root=$('#modal-root');
  const existing=$('.modal-bg', root);
  const scroll = existing ? $('.modal',existing).scrollTop : 0;
  if(!existing) lastFocus=document.activeElement;
  root.innerHTML=`<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.style.overflow='hidden';
  $('.modal',root).scrollTop=scroll;
  $('#mbg').onmousedown=e=>{ if(e.target.id==='mbg') closeModal(); };
  $$('[data-close]',root).forEach(b=>b.onclick=closeModal);
  if(!existing){ const f=$('input,select,textarea',root); if(f && window.innerWidth>700) f.focus(); }
}
function closeModal(){ $('#modal-root').innerHTML=''; document.body.style.overflow=''; try{ lastFocus?.focus(); }catch(e){} }
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#modal-root').innerHTML){ $('#modal-root').innerHTML=''; document.body.style.overflow=''; } });

/* ================= global delegation ================= */
document.addEventListener('click', async e=>{
  const q=e.target.closest('[data-quick]'); if(q){ e.stopPropagation(); return quickMark(q.dataset.key, q.dataset.d, q.dataset.quick); }
  const ss=e.target.closest('[data-sess]'); if(ss && !e.target.closest('.modal')) return openSession(ss.dataset.sess, ss.dataset.d);
  const am=e.target.closest('[data-addmk]'); if(am) return openMakeup({d:am.dataset.addmk});
  const ed=e.target.closest('[data-edit]'); if(ed) return studentForm(stuById(ed.dataset.edit));
  const gp=e.target.closest('[data-goprog]'); if(gp){ App.prog.sid=gp.dataset.goprog; return goView('progress'); }
  const gf=e.target.closest('[data-gofee]'); if(gf){ App.fee.sid=gf.dataset.gofee; return goView('fee'); }
  const go=e.target.closest('[data-go]'); if(go){ e.preventDefault(); return goView(go.dataset.go); }
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;
  if(act==='addStudent') studentForm(null);
  else if(act==='logout'){ if(Store.mode==='supa'){ try{ await Store.sb.auth.signOut(); }catch(_){} Store.supaUid=null; Store.supaUser=null; Store.cache={}; } sessClear(); App.u=null; authTab='login'; renderAuth(); }
  else if(act==='retry'){ Store.cache={}; renderMain(); }
});
document.addEventListener('keydown', e=>{ if((e.key==='Enter'||e.key===' ') && e.target.matches && e.target.matches('.sess[data-sess]')){ e.preventDefault(); openSession(e.target.dataset.sess, e.target.dataset.d); } });
function goView(v){ App.view=v; try{ history.replaceState(null,'','#'+v);}catch(e){} renderShell(); window.scrollTo(0,0); }

/* ================= boot ================= */
(async()=>{
  await initStore();
  if(Store.mode==='supa'){
    let recovery = /type=recovery/.test(location.hash||'');
    Store.sb.auth.onAuthStateChange((event, session)=>{
      if(event==='PASSWORD_RECOVERY'){ recovery=true; authTab='newpw'; renderAuthSupa(); }
      if(event==='SIGNED_OUT' && App.u){ App.u=null; Store.cache={}; authTab='login'; renderAuthSupa('Phiên đăng nhập đã hết hạn. Đăng nhập lại nhé.'); }
    });
    try{
      const {data}=await Store.sb.auth.getSession();
      const session=data?.session;
      if(recovery){ authTab='newpw'; renderAuthSupa(); return; }
      if(session){ Store.supaUid=session.user.id; Store.supaUser=session.user; try{ if(/access_token|type=signup/.test(location.hash)) history.replaceState(null,'',location.pathname); }catch(_){} await enterApp('me'); return; }
    }catch(e){ console.warn(e); }
    renderAuth(); return;
  }
  const u=sessGet();
  if(u){
    try{ const acc=await kvGet(K.accounts); if(acc?.users?.[u]){ await enterApp(u); return; } }catch(e){ console.warn(e); }
    sessClear();
  }
  renderAuth();
})();
})();
</script>
